<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, proxy-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#c4371b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Harino's" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Harino's Pizza</title>

    <link rel="canonical" href="https://harinos.store" />
    <meta
      name="description"
      content="Harino's Pizza - 100% Vegetarian handcrafted pizza, momos, and burgers. Order online at harinos.store."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harinos.store/" />
    <meta property="og:title" content="Harino's Pizza" />
    <meta
      property="og:description"
      content="Harino's Pizza ordering app with live offers, WhatsApp checkout, and installable home-screen access. Because Hari Knows."
    />
    <meta
      property="og:image"
      content="https://drive.google.com/thumbnail?id=1Gz7Qi82EYLJZxm1EfFxpXHHQ6mhKQIc4&sz=w1200"
    />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://harinos.store/" />
    <meta property="twitter:title" content="Harino's Pizza" />
    <meta
      property="twitter:description"
      content="Install Harino's Pizza for faster ordering, live offers, and WhatsApp checkout."
    />
    <meta
      property="twitter:image"
      content="https://drive.google.com/thumbnail?id=1Gz7Qi82EYLJZxm1EfFxpXHHQ6mhKQIc4&sz=w1200"
    />

    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              red: {
                650: '#c4371b',
                655: '#ab2c14',
                750: '#7d1807',
              }
            }
          }
        }
      }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      .font-display {
        font-family: 'Playfair Display', serif;
      }

      ::-webkit-scrollbar {
        display: none;
      }

      body,
      html {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }

      @keyframes install-attention-pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(196, 55, 27, 0.32);
          opacity: 1;
        }
        35% {
          transform: scale(1.08);
          box-shadow: 0 0 0 12px rgba(196, 55, 27, 0);
          opacity: 1;
        }
        55% {
          transform: scale(0.97);
          opacity: 0.92;
        }
      }

      @keyframes install-attention-shake {
        0%,
        100% {
          translate: 0 0;
        }
        20% {
          translate: -2px 0;
        }
        40% {
          translate: 2px 0;
        }
        60% {
          translate: -2px 0;
        }
        80% {
          translate: 2px 0;
        }
      }

      .install-attention {
        animation:
          install-attention-pulse 1.6s ease-in-out infinite,
          install-attention-shake 0.55s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes install-popup-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes cta-glow {
        0%,
        100% {
          box-shadow: 0 18px 40px rgba(220, 38, 38, 0.26);
        }
        50% {
          box-shadow: 0 24px 56px rgba(220, 38, 38, 0.4);
        }
      }

      .install-popup-card {
        animation: install-popup-float 4s ease-in-out infinite;
      }

      .cta-glow {
        animation: cta-glow 2.2s ease-in-out infinite;
      }

      /* Premium UI Elements & Micro-animations */
      .glass-card {
        background: rgba(255, 255, 255, 0.035);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .glass-card-hover {
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-card-hover:hover {
        transform: translateY(-4px) scale(1.008);
        background: rgba(255, 255, 255, 0.085);
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      }

      .text-glow {
        text-shadow: 0 0 16px rgba(196, 55, 27, 0.6);
      }

      .bg-gradient-premium {
        background: linear-gradient(135deg, #d33c20 0%, #8c1a08 100%);
      }

      .transition-premium {
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .btn-hover-scale {
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .btn-hover-scale:hover {
        transform: scale(1.03);
      }

      .btn-hover-scale:active {
        transform: scale(0.96);
      }

      @keyframes slide-in-up {
        from {
          transform: translateY(16px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .animate-slide-up {
        animation: slide-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes cart-bounce {
        0%, 100% { transform: scale(1); }
        30% { transform: scale(1.15) rotate(-3deg); }
        50% { transform: scale(0.95) rotate(3deg); }
        70% { transform: scale(1.05) rotate(-1deg); }
        85% { transform: scale(0.98); }
      }
      .animate-cart-bounce {
        animation: cart-bounce 0.6s cubic-bezier(0.25, 1.1, 0.5, 1.1) forwards;
      }

      @keyframes badge-bounce {
        0% { transform: scale(0.3); opacity: 0; }
        50% { transform: scale(1.3); }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-badge-bounce {
        animation: badge-bounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes text-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); color: #c4371b; }
      }
      .animate-text-pulse {
        animation: text-pulse 0.3s ease-out;
      }

      @keyframes item-slide-in {
        from { transform: translateX(30px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .animate-item-in {
        animation: item-slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes item-slide-out {
        from { transform: translateX(0); opacity: 1; max-height: 100px; margin-bottom: 20px; }
        to { transform: translateX(100%); opacity: 0; max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
      }
      .animate-item-out {
        animation: item-slide-out 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
